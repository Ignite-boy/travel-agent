name: Deploy Travel Agent to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run full test suite
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/332264924975/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@milan-500008.iam.gserviceaccount.com'
          project_id: 'milan-500008'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify gcloud authentication
        run: |
          gcloud auth list
          gcloud auth print-access-token >/dev/null
          gcloud config get-value project

      - name: Deploy via IAP tunnel
        run: |
          gcloud compute ssh np7218468_gmail_com@milan-prod \
            --zone=us-central1-f \
            --tunnel-through-iap \
            --command="git config --global --add safe.directory /home/np7218468_gmail_com/travel-agent && cd /home/np7218468_gmail_com/travel-agent && git fetch origin main && git reset --hard origin/main && source venv/bin/activate && pip install -r requirements.txt && (PM2_HOME=/home/np7218468_gmail_com/.pm2 pm2 restart travel-agent --update-env || (sudo rm -f /home/np7218468_gmail_com/.pm2/rpc.sock /home/np7218468_gmail_com/.pm2/pub.sock && PM2_HOME=/home/np7218468_gmail_com/.pm2 pm2 resurrect)) && sleep 3 && curl --fail --silent --show-error --retry 10 --retry-delay 3 http://127.0.0.1:8000/health | grep -q '"status":"ok"'"